name: Check Android native safe areas
on:
  push:
    branches: [main, codex/safe-area-native]
    paths: ['android/**', 'tests/android/**', 'tools/*inset*', 'dist/viewport.mjs', 'dist/layout.css', 'dist/layout.mjs', '.github/workflows/android-insets.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-insets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-insets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build isolated test app and instrumentation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export R8_JAR="$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar"
          export AAPT_BIN="$ANDROID_HOME/build-tools/35.0.0/aapt"
          export ZIPALIGN_BIN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          export APKSIGNER_JAR="$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
          # A new runner-only signer is shared by the two test APKs. Neither
          # fixture is published or used as the owner's release signing key.
          export TILEFORGE_KEYSTORE="$RUNNER_TEMP/inset-tests.jks"
          bash android/build.sh
          bash tools/build_inset_tests.sh
      - name: Exercise real Android view bounds in both orientations
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/run_android_inset_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-native-inset-results
          path: android/build/inset-results
